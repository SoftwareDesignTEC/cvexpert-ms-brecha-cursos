name: cvexpert-brecha-cursos

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${PGDATABASE:?Define PGDATABASE en .env}
      POSTGRES_USER: ${PGUSER:?Define PGUSER en .env}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Define PGPASSWORD en .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
